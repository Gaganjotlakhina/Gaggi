# One-click production deploy on Render: New → Blueprint → point at this repo.
# Creates the web service (Starter, always-on) + managed Postgres (basic-256mb).
databases:
  - name: one-vs-one-chat-db
    databaseName: one_vs_one_chat
    user: one_vs_one_chat
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: assi20tuc20
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: one-vs-one-chat-db
          property: connectionString
      - key: APP_URL
        value: https://assi20tuc20.com
      # Add your Stripe keys in the Render dashboard when ready to take payments:
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #   sync: false
